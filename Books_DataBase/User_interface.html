<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library ERP Portal</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f7f9;
      margin: 0;
      padding: 20px;
      color: #333;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
    }
    .erp-card {
      background: white;
      border: 1px solid #b2c8d9;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 20px;
    }
    .erp-header {
      background-color: #2b6cb0;
      color: white;
      padding: 12px 20px;
      font-size: 18px;
      font-weight: bold;
    }
    .erp-body {
      padding: 20px;
    }
    .filter-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .form-group label {
      font-size: 14px;
      font-weight: bold;
      color: #1a365d;
    }
    .form-group select {
      padding: 8px;
      border: 1px solid #b2c8d9;
      border-radius: 4px;
    }
    .btn-view {
      background-color: #d9534f;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn-view:hover {
      background-color: #c9302c;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      border: 1px solid #b2c8d9;
    }
    th {
      background-color: #e2e8f0;
      padding: 10px;
      text-align: left;
      border-bottom: 2px solid #b2c8d9;
    }
    td {
      padding: 10px;
      border-bottom: 1px solid #eee;
    }
    .badge {
      padding: 4px 8px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: bold;
      background-color: #c6f6d5;
      color: #22543d;
    }
    .btn-action {
      background-color: #3182ce;
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 3px;
      cursor: pointer;
      font-size: 12px;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- ERP Filter Box -->
  <div class="erp-card">
    <div class="erp-header">View Syllabus / Question Papers / Library Books</div>
    <div class="erp-body">
      <div class="filter-grid">
        
        <div class="form-group">
          <label>Select Year</label>
          <select id="selectYear" onchange="updateSemesters()">
            <option value="1">1st Year</option>
            <option value="2" selected>2nd Year</option>
            <option value="3">3rd Year</option>
            <option value="4">4th Year</option>
          </select>
        </div>

        <div class="form-group">
          <label>Select Semester</label>
          <select id="selectSem">
            <option value="3" selected>Semester 3</option>
            <option value="4">Semester 4</option>
          </select>
        </div>

        <div class="form-group">
          <label>Select Department</label>
          <select id="selectDept">
            <option value="CSE" selected>Computer Science & Engineering</option>
            <option value="ECE">Electronics & Communication</option>
            <option value="ME">Mechanical Engineering</option>
          </select>
        </div>

      </div>

      <button class="btn-view" onclick="loadBooks()">View</button>
    </div>
  </div>

  <!-- Results Table -->
  <table>
    <thead>
      <tr>
        <th>Book Title & Author</th>
        <th>Subject</th>
        <th>Shelf Location</th>
        <th>Status</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="booksTableBody">
      <!-- Loaded dynamically via API -->
    </tbody>
  </table>
</div>

<script>
  function updateSemesters() {
    const yr = parseInt(document.getElementById('selectYear').value);
    const semSelect = document.getElementById('selectSem');
    const sem1 = (yr * 2) - 1;
    const sem2 = yr * 2;
    semSelect.innerHTML = `<option value="${sem1}">Semester ${sem1}</option><option value="${sem2}">Semester ${sem2}</option>`;
  }

  async function loadBooks() {
    const yr = document.getElementById('selectYear').value;
    const sem = document.getElementById('selectSem').value;
    const dept = document.getElementById('selectDept').value;
    const tbody = document.getElementById('booksTableBody');

    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding: 20px;">Fetching from SQLite database...</td></tr>';

    try {
      const response = await fetch(`http://127.0.0.1:8000/api/books?year=${yr}&sem=${sem}&dept=${dept}`);
      const results = await response.json();

      if (results.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding: 20px;">No curriculum books found for selected criteria.</td></tr>';
        return;
      }

      tbody.innerHTML = results.map(b => `
        <tr>
          <td><strong>${b.title}</strong><br><small>by ${b.author}</small></td>
          <td>${b.subject}</td>
          <td>${b.rack}</td>
          <td><span class="badge">${b.avail} / ${b.total} Free</span></td>
          <td><button class="btn-action" onclick="alert('Physical hold requested for ${b.title}!')">Hold Book</button></td>
        </tr>
      `).join('');
    } catch (error) {
      tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding: 20px; color: red;">Error connecting to backend server. Make sure FastAPI is running!</td></tr>';
    }
  }

  window.onload = loadBooks;
</script>

</body>
</html>
